name: Sync chemistry-flashcards

on:
  repository_dispatch:
    types:
      - chemistry-flashcards-sync
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-chemistry-flashcards
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository || '46009361/chemistry-flashcards' }}
      SOURCE_REF: ${{ github.event.client_payload.source_sha || 'main' }}
      SOURCE_COMMIT_MESSAGE: ${{ github.event.client_payload.commit_message || 'Synchronize chemistry-flashcards' }}
      GIT_USER_NAME: "46009361"
      GIT_USER_EMAIL: "165697051+46009361@users.noreply.github.com"

    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check out source repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: .source-chemistry-flashcards
          fetch-depth: 1

      - name: Set up SSH signing key
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SSH_SIGNING_PRIVATE_KEY }}
          SIGNING_PUBLIC_KEY: ${{ secrets.SSH_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "::error::SSH_SIGNING_PRIVATE_KEY is empty or unavailable."
            exit 1
          fi

          if [ -z "${SIGNING_PUBLIC_KEY:-}" ]; then
            echo "::error::SSH_SIGNING_PUBLIC_KEY is empty or unavailable."
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SIGNING_KEY" > "$HOME/.ssh/github-signing"
          chmod 600 "$HOME/.ssh/github-signing"

          printf '%s\n' "$SIGNING_PUBLIC_KEY" > "$HOME/.ssh/github-signing.pub"
          chmod 644 "$HOME/.ssh/github-signing.pub"

          if ! grep -q '^-----BEGIN OPENSSH PRIVATE KEY-----$' "$HOME/.ssh/github-signing"; then
            echo "::error::SSH_SIGNING_PRIVATE_KEY does not look like an OpenSSH private key."
            exit 1
          fi

          eval "$(ssh-agent -s)"

          if [ -n "${SIGNING_PASSPHRASE:-}" ]; then
            ASKPASS_FILE="$RUNNER_TEMP/ssh-askpass"
            printf '%s\n' "$SIGNING_PASSPHRASE" > "$ASKPASS_FILE"
            chmod 700 "$ASKPASS_FILE"

            SSH_ASKPASS="$ASKPASS_FILE" \
            DISPLAY=:0 \
            SSH_ASKPASS_REQUIRE=force \
            ssh-add "$HOME/.ssh/github-signing"

            rm -f "$ASKPASS_FILE"
          else
            ssh-add "$HOME/.ssh/github-signing"
          fi

      - name: Synchronize files
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_DIR=".source-chemistry-flashcards"
          TARGET_DIR="chemistry-flashcards"

          mkdir -p "$TARGET_DIR"

          find "$TARGET_DIR" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +

          find "$SOURCE_DIR" \
            -mindepth 1 \
            -type f \
            -not -path "$SOURCE_DIR/.git/*" \
            -not -path "$SOURCE_DIR/.github/*" \
            -not -path '*/.*' \
            -print0 |
          while IFS= read -r -d '' source_file; do
            relative_path="${source_file#"$SOURCE_DIR"/}"
            target_file="$TARGET_DIR/$relative_path"

            mkdir -p "$(dirname "$target_file")"
            cp "$source_file" "$target_file"
          done

          rm -rf "$SOURCE_DIR"

      - name: Sign and push commit with verified SSH key
        shell: bash
        env:
          TARGET_PUSH_TOKEN: ${{ secrets.TARGET_PUSH_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"

          git config gpg.format ssh
          git config user.signingkey "$HOME/.ssh/github-signing.pub"
          git config commit.gpgsign true
          git config core.filemode false

          git add --all -- chemistry-flashcards

          if git diff --cached --quiet; then
            echo "No synchronization changes detected."
            exit 0
          fi

          git commit -S -m "$SOURCE_COMMIT_MESSAGE"

          git remote set-url origin \
            "https://x-access-token:${TARGET_PUSH_TOKEN}@github.com/46009361/46009361.com.git"

          git push origin HEAD:main
