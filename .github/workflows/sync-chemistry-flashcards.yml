name: Sync chemistry-flashcards

on:
  repository_dispatch:
    types:
      - chemistry-flashcards-sync
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-chemistry-flashcards
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository || '46009361/chemistry-flashcards' }}
      SOURCE_REF: ${{ github.event.client_payload.source_sha || 'main' }}
      SOURCE_COMMIT_MESSAGE: ${{ github.event.client_payload.commit_message || 'Synchronize chemistry-flashcards' }}
      GIT_USER_NAME: "46009361"
      GIT_USER_EMAIL: "165697051+46009361@users.noreply.github.com"

    steps:
      - name: Check out target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check out source repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.TARGET_PUSH_TOKEN }}
          path: .source-chemistry-flashcards
          fetch-depth: 1

      - name: Set up SSH signing key
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SSH_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          cat > ~/.ssh/id_ed25519 <<'EOF'
          ${SIGNING_KEY}
          EOF
          chmod 600 ~/.ssh/id_ed25519

          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          chmod 644 ~/.ssh/id_ed25519.pub

          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_ed25519

      - name: Synchronize files
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_DIR=".source-chemistry-flashcards"
          TARGET_DIR="chemistry-flashcards"

          mkdir -p "$TARGET_DIR"

          find "$TARGET_DIR" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +

          find "$SOURCE_DIR" \
            -mindepth 1 \
            -type f \
            -not -path "$SOURCE_DIR/.git/*" \
            -not -path "$SOURCE_DIR/.github/*" \
            -not -path '*/.*' \
            -print0 |
          while IFS= read -r -d '' source_file; do
            relative_path="${source_file#"$SOURCE_DIR"/}"
            target_file="$TARGET_DIR/$relative_path"

            mkdir -p "$(dirname "$target_file")"
            cp "$source_file" "$target_file"
          done

          rm -rf "$SOURCE_DIR"

      - name: Sign and push commit
        shell: bash
        env:
          TARGET_PUSH_TOKEN: ${{ secrets.TARGET_PUSH_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"

          git config gpg.format ssh
          git config user.signingkey ~/.ssh/id_ed25519.pub
          git config commit.gpgsign true

          git config core.filemode false

          git add --all -- chemistry-flashcards

          if git diff --cached --quiet; then
            echo "No synchronization changes."
            exit 0
          fi

          # Sign the commit with the SSH key tied to your GitHub account
          git commit -S -m "$SOURCE_COMMIT_MESSAGE"

          # Push using your account PAT so GitHub verifies the signed commit
          git remote set-url origin "https://x-access-token:${TARGET_PUSH_TOKEN}@github.com/46009361/46009361.com.git"
          git push origin HEAD:main
